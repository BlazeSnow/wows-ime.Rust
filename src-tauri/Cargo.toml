[package]
name = "wows-ime"
version = "2026.10.20"
description = "《战舰世界》中文输入法配置修改器"
authors = ["BlazeSnow"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wows_ime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# cargo build --release --features custom-protocol 时内嵌前端资产（msix 打包路径）
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# TSF 输入法扫描：ITfInputProcessorProfiles 位于 Win32_UI_TextServices
# 原生标题栏深色：DWMWA_USE_IMMERSIVE_DARK_MODE 位于 Win32_Graphics_Dwm
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 必须保留 unwind：release 下 panic = "abort" 会让 catch_unwind 失效，
# 而输入法扫描靠 catch_unwind 保证「扫描异常不中断界面」（与原 WinUI 3 版行为一致）。
panic = "unwind"
strip = true
